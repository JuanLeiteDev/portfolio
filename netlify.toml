# Netlify — static deploy of the Astro build.
# NOTE: no deploy has been performed. See README.md › Publicação.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Old-site URLs that may be bookmarked or indexed.
[[redirects]]
  from = "/assets/cv/cv.pdf"
  to = "/cv/juan-leite-cv-pt.pdf"
  status = 301

[[redirects]]
  from = "/assets/img/favicon.ico"
  to = "/favicon.ico"
  status = 301

# Security headers (no third-party resources are loaded by the site).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# Fingerprinted build assets and fonts can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cv/*"
  [headers.values]
    Content-Disposition = "attachment; filename=\"Juan-Leite-CV-PT.pdf\""
